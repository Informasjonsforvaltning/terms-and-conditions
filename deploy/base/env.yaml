---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terms-and-conditions
  labels:
    app: terms-and-conditions
spec:
  template:
    spec:
      containers:
        - name: terms-and-conditions
          env:
          - name: POSTGRESQL_HOST
            valueFrom:
              secretKeyRef:
                name: postgres
                key: HOST
          - name: POSTGRESQL_DB
            valueFrom:
              secretKeyRef:
                name: terms-and-conditions
                key: POSTGRESQL_DB
          - name: POSTGRESQL_USER
            valueFrom:
              secretKeyRef:
                name: terms-and-conditions
                key: POSTGRESQL_USER
          - name: POSTGRESQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: terms-and-conditions
                key: POSTGRESQL_PASSWORD
          - name: USER_API_KEY
            valueFrom:
              secretKeyRef:
                name: common
                key: USER_API_KEY
          - name: KEYCLOAK_OIDC_ISSUER
            valueFrom:
              secretKeyRef:
                name: keycloak
                key: KEYCLOAK_OIDC_ISSUER
          - name: CORS_ORIGIN_PATTERNS
            valueFrom:
              secretKeyRef:
                name: terms-and-conditions
                key: CORS_ORIGIN_PATTERNS
